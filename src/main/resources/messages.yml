# All texts of FailMultiWorld. Legacy, hex and MiniMessage are supported.
# <name> style tags are placeholders filled in by the plugin.
prefix: "<gradient:#B59BFF:#8A5CFF><bold>MWN</bold></gradient> &8» &7"

no-permission: "<prefix>&cYou do not have permission."
players-only: "<prefix>&cOnly players can do this."
unknown-command: "<prefix>&cUnknown subcommand. Use &f/mwn help&c."
usage: "<prefix>&cUsage: &f<usage>"
unknown-group: "<prefix>&cUnknown group: &f<group>"
unknown-world: "<prefix>&cUnknown or unloaded world: &f<name>"
unknown-player: "<prefix>&cPlayer not found: &f<player>"
invalid-name: "<prefix>&cInvalid name &f<name>&c (letters, digits, _ and -, 2-40 characters)."
invalid-environment: "<prefix>&cInvalid environment &f<value>&c. Use NORMAL, NETHER or THE_END."
reloaded: "<prefix>&aConfiguration reloaded."
version: "<prefix>&7FailMultiWorld &f<version>"

help:
  - "<prefix>&fFailMultiWorld &7- commands"
  - "&e/server [group] &7- selector / switch server"
  - "&e/servers &7- list servers"
  - "&e/mwn chat [group|global|staff] &7- chat mode"
  - "&e/mwn globalchat|staffchat <msg> &7- one-off message"
  - "&e/mwn msg <player> <msg> &7, &e/mwn reply <msg> &7, &e/mwn ignore <player>"
  - "&6Admin: &e/mwn create|delete|rename|list|info|group|ungroup|world|suggest"
  - "&6Admin: &e/mwn setspawn|setlobby|maintenance|set|feature|mutechat|announce"
  - "&e/mwn friend <add|accept|deny|remove|list|join> &7, &e/mwn profile [player] &7, &e/mwn queue [leave]"
  - "&6Admin: &e/mwn portal|gui|backup|backups|restore|status|diagnostics|integrations|debug|reload"

# ---- groups / worlds ----
creating: "<prefix>&7Creating world &f<name>&7, this can take a moment..."
created:
  - "<prefix>&aVirtual server created."
  - "&7Name: &f<name> &8| &7ID: &f<id>"
  - "&7World: &f<world>"
  - "&7Spawn: &f<spawn>"
  - "&7Use &f/mwn world create <world> --group <name> &7to add more worlds."
group-exists: "<prefix>&cA group named &f<name>&c already exists."
group-renamed: "<prefix>&aGroup &f<old>&a renamed to &f<new>&a (ID &f<id>&a unchanged)."
group-not-empty: "<prefix>&cGroup &f<group>&c still has players. Move them away first."
delete-warning: "<prefix>&cThis deletes group &f<group>&c. Worlds: &f<worlds>&c. Type &f/mwn delete <group> confirm &c(deletes the worlds too) or &f/mwn delete <group> keepworlds &cwithin 30 seconds."
delete-done: "<prefix>&aGroup &f<group>&a deleted."
confirm-expired: "<prefix>&cNothing to confirm (or the confirmation expired)."
world-exists: "<prefix>&cWorld &f<name>&c is already loaded."
world-folder-exists: "<prefix>&cA folder named &f<name>&c already exists. Use &f/mwn world import <name>&c."
world-folder-missing: "<prefix>&cNo world folder named &f<name>&c found."
world-create-failed: "<prefix>&cCould not create world &f<name>&c."
world-created: "<prefix>&aWorld &f<world> &a(<environment>) ready. Group: &f<group>"
world-assigned: "<prefix>&aWorld &f<world>&a assigned to <group>&a."
world-unassigned: "<prefix>&aWorld &f<world>&a is no longer assigned."
world-not-assigned: "<prefix>&cWorld &f<world>&c is not assigned to any group."
assign-cancelled: "<prefix>&cThe change for world &f<world>&c was cancelled."
world-delete-warning: "<prefix>&cThis permanently deletes world &f<world>&c. Type &f/mwn world delete <world> confirm &cwithin 30 seconds."
world-deleted: "<prefix>&aWorld &f<world>&a deleted."
world-protected: "<prefix>&cWorld &f<name>&c is a main server world and cannot be deleted."
world-not-empty: "<prefix>&cWorld &f<name>&c still has players."
world-unload-failed: "<prefix>&cWorld &f<name>&c could not be unloaded."
unsafe-path: "<prefix>&cRefusing to delete &f<name>&c: its folder is not a normal world folder."
world-list-header: "<prefix>&7Worlds (&f<count>&7):"
world-list-entry: "&8 - &f<world> &7<environment> &8| &7group: &f<group> &8| &7players: &f<players>"
world-info:
  - "<prefix>&fWorld &e<world>"
  - "&7Environment: &f<environment> &8| &7Group: &f<group>"
  - "&7Players: &f<players> &8| &7Loaded chunks: &f<chunks>"
  - "&7Seed: &f<seed> &8| &7Difficulty: &f<difficulty>"
spawn-set: "<prefix>&aSpawn of <group>&a set to your position."
spawn-wrong-world: "<prefix>&cYou must stand in a world of group &f<group>&c."
lobby-set: "<prefix>&aLobby group set to <group>&a."
maintenance-on: "<prefix>&eMaintenance enabled for <group>&e."
maintenance-off: "<prefix>&aMaintenance disabled for <group>&a."
mutechat-on: "<prefix>&eChat muted in <group>&e."
mutechat-off: "<prefix>&aChat unmuted in <group>&a."
announce: "&8[&6Announcement&8] &f<message>"
announce-sent: "<prefix>&aAnnouncement sent to <group>&a."
setting-updated: "<prefix>&aSetting &f<setting>&a of <group>&a is now &f<value>&a."
setting-invalid: "<prefix>&cInvalid value: &f<value>"
setting-unknown: "<prefix>&cUnknown setting: &f<setting>"
feature-set: "<prefix>&aFeature &f<feature>&a in <group>&a: &f<value>"
feature-disabled: "<prefix>&c<feature> is not available on this server."

list-header: "<prefix>&7Virtual servers (&f<count>&7):"
list-entry: "&8 - <group> &8| &f<players>&7/&f<max> &8| &7<status>"
list-hover: "&7Click to join"
info:
  - "<prefix><group> &8(&f<key>&8, ID &f<id>&8)"
  - "&7Worlds: &f<worlds>"
  - "&7Players: &f<players>&7/&f<max> &8| &7Maintenance: &f<maintenance>"
  - "&7Isolated chat: &f<chat> &8| &7Inventory: &f<inventory> &8| &7Ender chest: &f<enderchest> &8| &7XP: &f<xp>"
  - "&7Difficulty: &f<difficulty> &8| &7Spawn: &f<spawn>"
  - "&7Description: &f<description>"

suggest-none: "<prefix>&7No unassigned worlds look related to a group."
suggest-header: "<prefix>&7Suggested assignments (use &f/mwn group <world> <group>&7 or &f/mwn suggest apply&7):"
suggest-entry: "&8 - &f<world> &7-> &f<group> &8(<confidence>%, <reason>)"
suggest-applied: "<prefix>&aAssigned &f<count>&a world(s) with high confidence."

# ---- switching ----
switched: "<prefix>&aYou are now on <group>&a."
already-in-group: "<prefix>&cYou are already on <group>&c."
no-group-permission: "<prefix>&cYou may not join <group>&c."
maintenance: "<prefix><group>&c is in maintenance."
group-full: "<prefix><group>&c is full."
no-worlds: "<prefix><group>&c has no loaded world or spawn."
transfer-cooldown: "<prefix>&cWait &f<seconds>s&c before switching again."
transfer-busy: "<prefix>&cYour previous transfer is still running."
transfer-failed: "<prefix>&cTransfer failed. Nothing was changed, please try again."
player-joined-group: "<prefix>&a<player> &7joined this server."
player-left-group: "<prefix>&c<player> &7left this server."

# ---- chat ----
chat-muted: "<prefix>&cChat is muted on this server."
chat-cooldown: "<prefix>&cWait &f<seconds>s&c before chatting again."
chat-blocked: "<prefix>&cYour message contains a blocked word."
chat-mode-current: "<prefix>&7Chat mode: &f<mode>"
chat-mode-set: "<prefix>&aChat mode set to &f<mode>&a."
msg-to: "&8[&7You &8-> &f<player>&8] &f<message>"
msg-from: "&8[&f<player> &8-> &7You&8] &f<message>"
msg-ignored: "<prefix>&c<player> is not accepting your messages."
msg-other-group: "<prefix>&c<player> is on another server."
no-reply-target: "<prefix>&cNobody to reply to."
ignore-on: "<prefix>&aYou now ignore &f<player>&a."
ignore-off: "<prefix>&aYou no longer ignore &f<player>&a."
build-denied: "<prefix>&cBuilding is disabled here."

# ---- backups ----
backup-no-worlds: "<prefix>&cGroup &f<group>&c has no loaded worlds to back up."
backup-started: "<prefix>&7Backing up &f<group>&7..."
backup-done: "<prefix>&aBackup of &f<group>&a done: &f<file> &7(<size>, verified)"
backup-failed: "<prefix>&cBackup of &f<group>&c failed, see console."
backups-header: "<prefix>&7Backups of &f<group>&7 (&f<count>&7):"
backups-entry: "&8 - &f<file> &7<size>"

# ---- diagnostics ----
status:
  - "<prefix>&fMWN status"
  - "&7Groups: &f<groups> &8| &7Worlds: &f<worlds> &8| &7Online: &f<online>"
  - "&7TPS: &f<tps> &8| &7Memory: &f<memory>"
  - "&7Database: &f<db> &8| &7Failures: &f<failures>"
  - "&7Active transfers: &f<transfers>"
diag-group: "&8 - &f<key> &8(<id>) &7players: &f<players> &8| &7worlds: &f<worlds> &8| &7maintenance: &f<maintenance>"
integration-line: "&8 - &f<name>&7: <status> &8(<note>)"
integration-found: "&afound"
integration-missing: "&cmissing"
integration-note-placeholderapi: "&7used for %placeholders%"
integration-note-luckperms: "&7permission nodes work through Bukkit, no hard link"
integration-note-vault: "&7used only when economy.provider is true"
debug-on: "<prefix>&aDebug logging enabled."
debug-off: "<prefix>&7Debug logging disabled."

# ---- placeholders / statuses ----
status-online: "&aOnline"
status-maintenance: "&eMaintenance"
status-full: "&cFull"
unlimited: "unlimited"
placeholder-no-group: "none"
placeholder-unknown-group: "?"

# ---- portals / admin gui ----
portal-pos: "<prefix>&aPosition &f<pos>&a set to your block."
portal-created: "<prefix>&aPortal &f<name>&a -> &f<group>&a created (permission &f<permission>&a)."
portal-exists: "<prefix>&cPortal &f<name>&c already exists."
portal-no-selection: "<prefix>&cSet both corners first: &f/mwn portal pos1&c and &f/mwn portal pos2&c (same world)."
portal-unknown: "<prefix>&cUnknown portal: &f<name>"
portal-deleted: "<prefix>&aPortal &f<name>&a deleted."
portal-toggled: "<prefix>&aPortal &f<name>&a enabled: &f<value>"
portal-no-permission: "<prefix>&cYou may not use this portal."
portal-list-header: "<prefix>&7Portals (&f<count>&7):"
portal-list-entry: "&8 - &f<name> &7world: &f<world> &8| &7group: &f<group> &8| &7enabled: &f<enabled>"
admin-gui-title: "<gradient:#B59BFF:#8A5CFF>MWN administration</gradient>"
admin-gui-lore:
  - "&7Key: &f<key> &8(<id>)"
  - "&7Players: &f<players>&7/&f<max> &8| &7Worlds: &f<worlds>"
  - "&7Maintenance: &f<maintenance> &8| &7Chat muted: &f<muted>"
  - ""
  - "&eLeft click: &7toggle maintenance"
  - "&eShift click: &7toggle chat mute"
  - "&eRight click: &7show info"

# ---- friends / profile / resource pack ----
friends-disabled: "<prefix>&cThe friends system is disabled."
friend-self: "<prefix>&cYou cannot add yourself."
friend-already: "<prefix>&c<player> is already your friend."
friend-limit: "<prefix>&cFriend list limit reached."
friend-request-pending: "<prefix>&cYou already sent a request to <player>."
friend-request-sent: "<prefix>&aFriend request sent to &f<player>&a."
friend-request-received: "<prefix>&f<player>&7 wants to be your friend. &a/mwn friend accept <player> &7or &c/mwn friend deny <player>"
friend-no-request: "<prefix>&cNo request from &f<player>&c (the player must be online)."
friend-added: "<prefix>&aYou and &f<player>&a are now friends."
friend-denied: "<prefix>&7Request from &f<player>&7 denied."
friend-removed: "<prefix>&7&f<player>&7 removed from your friends."
friend-not-found: "<prefix>&c<player> is not in your friend list."
friend-offline: "<prefix>&c<player> is offline."
friend-hidden-server: "<prefix>&cServer information of friends is hidden."
friend-hidden: "hidden"
friend-joined: "<prefix>&aYour friend &f<player>&a is online."
friend-left: "<prefix>&7Your friend &f<player>&7 went offline."
friend-list-header: "<prefix>&7Friends (&f<count>&7):"
friend-list-online: "&8 - &a<player> &7on &f<server>"
friend-list-offline: "&8 - &7<player> (offline)"
profile:
  - "<prefix>&fProfile of &e<player>"
  - "&7Server: &f<group> &8| &7Joined: &f<joined>"
  - "&7Playtime total: &f<total> &8| &7here: &f<current> &8| &7Friends: &f<friends>"
profile-group-entry: "&8 - &f<group>&7: &f<time>"
pack-loading: "<prefix>&7Loading resource pack of <group>&7..."
pack-failed: "<prefix>&cThe resource pack could not be loaded or was declined."

# ---- queue ----
queue-joined: "<prefix><group>&7 is full. You are in the queue at position &f<position>&7. &8(/mwn queue leave)"
queue-position: "<prefix>&7Queue for <group>&7: position &f<position>&7."
queue-slot: "<prefix>&aA slot on <group>&a is free, connecting you..."
queue-left: "<prefix>&7You left the queue."
queue-not-queued: "<prefix>&cYou are not in a queue."

# ---- restore ----
restore-warning: "<prefix>&cThis REPLACES the worlds of &f<group>&c with backup &f<file>&c. Current world folders are kept as *.pre-restore-*. Players must have left the group. Type &f/mwn restore <group> <file> confirm &cwithin 30 seconds."
restore-started: "<prefix>&7Restoring &f<group>&7 from &f<file>&7..."
restore-done: "<prefix>&aRestore of &f<group>&a finished and worlds reloaded."
restore-failed: "<prefix>&cRestore of &f<group>&c failed and was rolled back, see console."
restore-invalid-archive: "<prefix>&cBackup &f<file>&c is invalid or does not belong to this group."
restore-no-backups: "<prefix>&cNo backups for &f<group>&c."
restore-file-unknown: "<prefix>&cUnknown backup file: &f<file>"
